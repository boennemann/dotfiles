# Starship prompt — matching old .bash_prompt on Solarized Dark
# "sbw at Mac in ~/path on branch [$]"

format = """
$username\
$hostname\
$directory\
$git_branch\
$git_status\
$nodejs\
$golang\
$ruby\
$python\
$cmd_duration\
$line_break\
$character"""

[username]
show_always = true
format = "[$user]($style) "
style_user = "bold #cb4b16"
style_root = "bold red"

[hostname]
ssh_only = false
format = "[at](bold white) [$hostname]($style) [in](bold white) "
style = "bold #b58900"

[directory]
truncation_length = 5
truncate_to_repo = false
style = "bold #859900"
format = "[$path]($style)[$read_only]($read_only_style) "

[git_branch]
format = "[on](bold white) [$branch]($style) "
style = "bold #6c71c4"

[git_status]
format = '([$all_status$ahead_behind]($style))'
style = "bold #268bd2"

[nodejs]
format = " [$symbol($version)]($style)"
symbol = "node "

[golang]
format = " [$symbol($version)]($style)"
symbol = "go "

[ruby]
format = " [$symbol($version)]($style)"
symbol = "rb "

[python]
format = " [$symbol($version)]($style)"
symbol = "py "

[cmd_duration]
min_time = 2_000
format = " took [$duration]($style)"

[character]
success_symbol = "[\\$](bold #fdf6e3)"
error_symbol = "[\\$](bold red)"
