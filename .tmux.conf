# Use Ctrl+A as the prefix key
set -g prefix C-a
unbind C-b
bind C-a send-prefix

# Use Vim shortcuts
setw -g mode-keys vi

# Make `Ctrl+A R` reload the config file
unbind r
bind r source-file ~/.tmux.conf

# True color support (needed for delta, bat, eza colors in tmux)
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"

# Mouse support (scroll, click panes, resize)
set -g mouse on

# Start window/pane numbering at 1 (0 is far from prefix key)
set -g base-index 1
setw -g pane-base-index 1

# Increase scrollback
set -g history-limit 50000

# Faster escape time (important for vim users)
set -sg escape-time 10

# Intuitive splits (| and -)
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# New windows/panes inherit current path
bind c new-window -c "#{pane_current_path}"

# Status bar — minimal, Solarized Dark
set -g status-style "bg=#073642,fg=#839496"
set -g status-left "#[bold]#S "
set -g status-right ""
set -g window-status-current-style "fg=#b58900,bold"
